[project]
name = "lodestone"
version = "0.1.0"
description = "Local semantic search for files and images on Windows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lancedb>=0.25",
    "markitdown[docx,pptx,xlsx]>=0.1",
    "numpy>=2.0",
    "onnxruntime>=1.22",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pyarrow>=18.0",
    "pymupdf>=1.26",
    "pyside6>=6.8",
    "rapidocr>=3.9",
    "sentence-transformers>=6.1",
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=5.0",
    "watchdog>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lodestone = "lodestone.cli:main"

[project.gui-scripts]
lodestone-gui = "lodestone.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lodestone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs downloaded models and is slow"]
addopts = "-m 'not models'"
